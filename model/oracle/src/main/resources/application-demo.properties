# Profile "demo": the console first-login walk-through (demo/FirstLoginDemo) with the demo identity check.
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=warn
logging.level.com.masterantique=info
# The demo is a console run: no web server, so the process ends when the walk-through does.
spring.main.web-application-type=none
