spring.application.name=mar-backend

# --- Connection to the migrated PostgreSQL database. How to create the login and a network route:
#     claude_modernization/docs/dbmigrate/iteration5/PostgreSQLDatabaseGuide.html
#   localhost proxy      MAR_DB_HOST=localhost     MAR_DB_PORT=5433   (defaults below)
#   container address    MAR_DB_HOST=172.17.0.x    MAR_DB_PORT=5432
#   app in Docker        MAR_DB_HOST=mar-postgres  MAR_DB_PORT=5432
# The password is never written here: it must come from the MAR_DB_PASSWORD environment variable.
spring.datasource.url=jdbc:postgresql://${MAR_DB_HOST:localhost}:${MAR_DB_PORT:5433}/${MAR_DB_NAME:masterantique}
spring.datasource.username=${MAR_DB_USER:mar_app}
spring.datasource.password=${MAR_DB_PASSWORD}

# --- Connection pool (HikariCP)
spring.datasource.hikari.pool-name=mar-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

# --- JPA / Hibernate. The schema was migrated and verified: check it, never create or change it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
# Uncomment to see the SQL Hibernate sends:
#logging.level.org.hibernate.SQL=debug
